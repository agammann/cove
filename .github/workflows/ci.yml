name: Cove verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: cove
          POSTGRES_PASSWORD: cove-ci-disposable
          POSTGRES_DB: cove
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cove" --health-interval 5s --health-timeout 3s --health-retries 20
      mail:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Configure disposable test environment
        run: |
          node scripts/setup-env.mjs
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('.env',fs.readFileSync('.env','utf8').replace('postgresql://cove:cove-local-only@localhost:55439/cove','postgresql://cove:cove-ci-disposable@localhost:5432/cove'));"
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:local
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run manual browser journey
        run: |
          pnpm start > /tmp/cove-server.log 2>&1 &
          node --input-type=module -e "for(let i=0;i<60;i++){try{const r=await fetch('http://localhost:4317/health/ready');if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,1000));}process.exit(1);"
          pnpm test:browser
      - run: pnpm scan:secrets
      - run: pnpm audit --audit-level=low
      - run: docker build -t cove:ci .
      - run: pnpm build
      - name: Verify the compiled Sites browser journey
        run: |
          pnpm exec wrangler d1 execute DB --local --config .sites-runtime/wrangler.json --file drizzle/0000_sticky_juggernaut.sql
          pnpm exec wrangler d1 execute DB --local --config .sites-runtime/wrangler.json --file drizzle/0001_sites_auth.sql
          pnpm exec wrangler d1 execute DB --local --config .sites-runtime/wrangler.json --file drizzle/0002_integrity.sql
          pnpm exec wrangler dev --local --config .sites-runtime/wrangler.json --ip 127.0.0.1 --port 4318 --inspector-port 0 > /tmp/cove-sites.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          node --input-type=module -e "for(let i=0;i<60;i++){try{const r=await fetch('http://localhost:4318');if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,1000));}process.exit(1);"
          node scripts/verify-sites-browser.mjs
          node scripts/verify-sites-mcp.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cove-verification
          path: |
            docs/sites-browser-verification.json
            docs/design/
            test-results/
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/setup-env.mjs
      - run: docker compose up -d --wait db mail
      - run: pnpm db:migrate
      - run: pnpm build:local
      - name: Create fictional saved context and an assistant grant
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          import { Pool } from 'pg';
          import { CoveService } from './dist/packages/domain/service.js';
          import { emptyContext } from './dist/packages/shared/context.js';
          process.loadEnvFile('.env');
          const pool = new Pool({connectionString:process.env.DATABASE_URL});
          try {
            const userId = randomUUID();
            await pool.query('INSERT INTO "user"(id,name,email,"emailVerified") VALUES($1,$2,$3,true)',[userId,'Recovery fixture',`${userId}@example.test`]);
            const service = new CoveService(pool,{MAX_PROJECTS:50,MAX_REVISIONS:1000,MAX_STORAGE_BYTES:104857600});
            const actor = {userId};
            const context = {...emptyContext(),goal:'Preserve this fictional project through backup and restart.'};
            const project = await service.createProject(actor,{name:'Recovery fixture',context});
            await service.createHandoff(actor,project.id,{expectedVersion:1,requestKey:randomUUID()});
            await service.saveConnection(actor,{clientId:'recovery-fixture',label:'Recovery fixture',grants:[{projectId:project.id,capabilities:['read']}]});
          } finally { await pool.end(); }
          NODE
      - run: node scripts/backup-verify.mjs
      - run: docker build -t cove:1.0.0 .
      - run: node scripts/verify-container.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cove-recovery-verification
          path: |
            docs/recovery-verification.json
            docs/container-verification.json
      - name: Remove this disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  source:
    name: Package committed source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node scripts/package-release.mjs
      - name: Check source archive and checksum
        run: |
          cd release-artifacts
          sha256sum -c cove_*.zip.sha256
          unzip -t cove_*.zip
      - name: Keep versioned source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cove-source
          path: |
            release-artifacts/cove_*_source.zip
            release-artifacts/cove_*_source.zip.sha256
          if-no-files-found: error
          overwrite: true
  publish:
    name: Publish verified source release
    needs: [verify, recovery, source]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cove-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read source package from this verified run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cove-source
          path: release-artifacts
      - name: Publish complete source package
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { default: publish } = await import(pathToFileURL(resolve('scripts/release.mjs')).href);
            await publish({ github, context, core });
