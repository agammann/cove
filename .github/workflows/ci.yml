name: Cove verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: cove
          POSTGRES_PASSWORD: cove-ci-disposable
          POSTGRES_DB: cove
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cove" --health-interval 5s --health-timeout 3s --health-retries 20
      mail:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Configure disposable test environment
        run: |
          node scripts/setup-env.mjs
          node --input-type=module -e "import fs from 'node:fs'; const p='.env'; const s=fs.readFileSync(p,'utf8'); fs.writeFileSync(p,s.replace(/^DATABASE_URL=.*$/m,'DATABASE_URL=postgresql://cove:cove-ci-disposable@localhost:5432/cove'));"
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:local
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run manual browser journey
        env:
          RATE_LIMIT: "10000"
        run: |
          pnpm start > /tmp/cove-server.log 2>&1 &
          node --input-type=module -e "for(let i=0;i<60;i++){try{const r=await fetch('http://localhost:4317/health/ready');if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,1000));}process.exit(1);"
          pnpm test:browser
      - run: pnpm scan:secrets
      - run: pnpm audit --audit-level=low
      - run: docker build -t cove:ci .
      - run: pnpm build
      - name: Verify the compiled Sites browser journey
        run: |
          pnpm exec wrangler d1 execute DB --local --config .sites-runtime/wrangler.json --file drizzle/0000_sticky_juggernaut.sql
          pnpm exec wrangler d1 execute DB --local --config .sites-runtime/wrangler.json --file drizzle/0001_sites_auth.sql
          pnpm exec wrangler d1 execute DB --local --config .sites-runtime/wrangler.json --file drizzle/0002_integrity.sql
          pnpm exec wrangler dev --local --config .sites-runtime/wrangler.json --ip 127.0.0.1 --port 4318 --inspector-port 0 > /tmp/cove-sites.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          node --input-type=module -e "for(let i=0;i<60;i++){try{const r=await fetch('http://localhost:4318');if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,1000));}process.exit(1);"
          node scripts/verify-sites-browser.mjs
          node scripts/verify-sites-mcp.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cove-verification
          path: |
            docs/sites-browser-verification.json
            docs/design/
            test-results/
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/setup-env.mjs
      - run: docker compose up -d --wait db mail
      - run: pnpm db:migrate
      - run: pnpm build:local
      - name: Create fictional saved context and an assistant grant
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          import { Pool } from 'pg';
          import { CoveService } from './dist/packages/domain/service.js';
          import { emptyContext } from './dist/packages/shared/context.js';
          process.loadEnvFile('.env');
          const pool = new Pool({connectionString:process.env.DATABASE_URL});
          try {
            const userId = randomUUID();
            await pool.query('INSERT INTO "user"(id,name,email,"emailVerified") VALUES($1,$2,$3,true)',[userId,'Recovery fixture',`${userId}@example.test`]);
            const service = new CoveService(pool,{MAX_PROJECTS:50,MAX_REVISIONS:1000,MAX_STORAGE_BYTES:104857600});
            const actor = {userId};
            const context = {...emptyContext(),goal:'Preserve this fictional project through backup and restart.'};
            const project = await service.createProject(actor,{name:'Recovery fixture',context});
            await service.createHandoff(actor,project.id,{expectedVersion:1,requestKey:randomUUID()});
            await service.saveConnection(actor,{clientId:'recovery-fixture',label:'Recovery fixture',grants:[{projectId:project.id,capabilities:['read']}]});
          } finally { await pool.end(); }
          NODE
      - name: Verify the exclusive local backup
        run: |
          # Incompressible synthetic data exceeds pipe buffers: pg_restore --list
          # may close its input after the TOC without consuming the whole archive.
          docker compose exec -T db psql -U cove -d cove -v ON_ERROR_STOP=1 -c "CREATE TABLE cove_large_backup_fixture AS SELECT i, md5(i::text) || md5((i + 2000000)::text) AS payload FROM generate_series(1, 500000) AS i"
          backup="$RUNNER_TEMP/cove-local-backup-fixture.dump"
          node scripts/backup-local.mjs "$backup"
          before=$(sha256sum "$backup")
          if node scripts/backup-local.mjs "$backup"; then echo 'Existing backup was overwritten' >&2; exit 1; fi
          test "$before" = "$(sha256sum "$backup")"
          docker compose exec -T db createdb -U cove cove_backup_fixture
          docker compose exec -T db pg_restore -U cove -d cove_backup_fixture --exit-on-error --no-owner < "$backup"
          test "$(docker compose exec -T db psql -U cove -d cove_backup_fixture -Atc "SELECT count(*) FROM projects WHERE name='Recovery fixture'")" = 1
          test "$(docker compose exec -T db psql -U cove -d cove_backup_fixture -Atc 'SELECT count(*) FROM cove_large_backup_fixture')" = 500000
      - run: node scripts/backup-verify.mjs
      - run: docker build -t cove:1.0.2 .
      - run: node scripts/verify-container.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cove-recovery-verification
          path: |
            docs/recovery-verification.json
            docs/container-verification.json
      - name: Remove this disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  source:
    name: Package committed source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: cove
          POSTGRES_PASSWORD: cove-ci-disposable
          POSTGRES_DB: cove
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cove" --health-interval 5s --health-timeout 3s --health-retries 20
      mail:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node scripts/package-release.mjs
      - name: Check source archive and checksum
        run: |
          cd release-artifacts
          sha256sum -c cove_*.zip.sha256
          unzip -t cove_*.zip
      - name: Extract a fresh source consumer outside the checkout
        run: |
          consumer_root=$(mktemp -d "$RUNNER_TEMP/cove-consumer.XXXXXX")
          unzip -q release-artifacts/cove_*_source.zip -d "$consumer_root"
          version=$(node -p "require('./package.json').version")
          consumer="$consumer_root/cove-$version"
          test -f "$consumer/pnpm-lock.yaml"
          test ! -e "$consumer/node_modules"
          test ! -e "$consumer/.git"
          echo "SOURCE_CONSUMER=$consumer" >> "$GITHUB_ENV"
      - run: npm install --global pnpm@11.19.0
      - name: Frozen install from the extracted archive
        working-directory: ${{ env.SOURCE_CONSUMER }}
        run: pnpm install --frozen-lockfile
      - name: Configure the extracted disposable environment
        working-directory: ${{ env.SOURCE_CONSUMER }}
        run: |
          node scripts/setup-env.mjs
          node --input-type=module -e "import fs from 'node:fs'; const p='.env'; const s=fs.readFileSync(p,'utf8'); fs.writeFileSync(p,s.replace(/^DATABASE_URL=.*$/m,'DATABASE_URL=postgresql://cove:cove-ci-disposable@localhost:5432/cove'));"
      - name: Build and test the extracted PostgreSQL consumer
        working-directory: ${{ env.SOURCE_CONSUMER }}
        run: |
          pnpm db:migrate
          pnpm lint && pnpm typecheck && pnpm test && pnpm build:local
      - name: Smoke the extracted production server
        working-directory: ${{ env.SOURCE_CONSUMER }}
        run: |
          pnpm start > "$RUNNER_TEMP/cove-consumer-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node --input-type=module -e "for(let i=0;i<60;i++){try{const r=await fetch('http://localhost:4317/health/ready');if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,1000));}process.exit(1);"
          curl --fail --silent http://localhost:4317/ > /dev/null
      - name: Keep versioned source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cove-source
          path: |
            release-artifacts/cove_*_source.zip
            release-artifacts/cove_*_source.zip.sha256
          if-no-files-found: error
          overwrite: true
  artifact-transfer:
    needs: [verify, recovery, source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download source package (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cove-source
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download source package (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cove-source
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download source package (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cove-source
          path: release-artifacts
      - name: Verify transferred package
        working-directory: release-artifacts
        run: |
          sha256sum -c cove_*.zip.sha256
          unzip -t cove_*.zip
      - name: Exercise publisher using in-memory clients
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { verifyActionCompatibility } = await import(process.env.GITHUB_WORKSPACE + '/scripts/test-action-compat.mjs');
            await verifyActionCompatibility();
  artifact-missing-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe a nonexistent artifact
        id: missing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cove-nonexistent-transfer-guard
      - name: Reject an unexpected result
        if: always() && steps.missing.outcome != 'failure'
        run: exit 1
  publish:
    name: Publish verified source release
    needs: [verify, recovery, source, artifact-transfer, artifact-missing-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cove-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download source package (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cove-source
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download source package (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cove-source
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download source package (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cove-source
          path: release-artifacts
      - name: Publish complete source package
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { default: publish } = await import(pathToFileURL(resolve('scripts/release.mjs')).href);
            await publish({ github, context, core });

