name: cove
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cove-local-only}
      POSTGRES_DB: cove
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["cove-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove -d cove"]
      interval: 5s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  cove-data:

