name: cove-production
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
      POSTGRES_DB: cove
    volumes: ["database:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove -d cove"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    image: cove:0.1.0
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4317
      TRUST_PROXY: "true"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "dist/apps/api/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      COVE_DOMAIN: ${COVE_DOMAIN:?Set the approved domain}
    ports: ["80:80", "443:443"]
    volumes:
      [
        "./Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy-data:/data",
        "caddy-config:/config",
      ]
    depends_on: [api]
    restart: unless-stopped
volumes:
  database:
  caddy-data:
  caddy-config:
